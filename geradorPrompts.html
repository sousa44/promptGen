<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGen</title>

    <!--css-->
    <link rel="stylesheet" href="assets/css/style.css">

    <!--prompts css-->
    <link rel="stylesheet" href="assets/css/prompts.css">

    <!--normalize css-->
    <link rel="stylesheet" href="assets/css/normalize.css">

    <!--media queries-->
    <link rel="stylesheet" href="assets/css/mediaQueries.css">

    <!--font awesome-->
    <link rel="stylesheet" href="assets/fontes/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/all.min.css">

    <!--bootsrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


</head>

<body>



    <header id="hero-main"> <!--hero-main-->
        <nav class="navbar navbar-expand-lg " id="hero-main__nav"> <!--hero-main__nav-->
            <div class="container-fluid">
                <a class="navbar-brand" href="#"> <img src="assets/imagens/teleprompter.png" alt="teleprompter"
                        class="hero-main__nav-img">PromptGen</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"><i class="fa-solid fa-bars"></i></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link btn-link" href="#prompts" type="button">Começar agora</a>
                        </li>


                    </ul>
                </div>
            </div>
        </nav><!--hero-main__nav-->


    </header><!--hero-main-->

    <main>

        <div id="hero-banner" class="container"> <!--hero-banner-->


            <h1 class="title">
                Gerador de <span class="title__span" lang="es">Prompts</span>
            </h1>

            <p class="heroBanner__textResumo">
                Crie, salve e organize seus prompts favoritos para usar com IA.

            </p>


        </div><!--hero-banner-->


        <div class="containerPrompts"> <!--containerPrompts-->


            <section id="prompts"> <!--prompts-->

                <article class="novoProduto">

                    <h2 class="prompts_subtitle">
                        <i class="fa-regular fa-pen-to-square"></i>
                        Novo Prompt
                    </h2>

                    <form class="produtoForm">

                        <label for="tituloPrompt"> Titulo do prompt</label>
                        <input type="text" id="tituloPrompt" autocomplete="off" class="form-control"
                            placeholder="Ex:ideia de post para redes sociais">

                        <label for="promptText">Digite seu Prompt</label>

                        <textarea name="promptTex" id="promptText" cols="30" rows="8" class="form-control"
                            placeholder="Escreva aqui seu prompt..."></textarea>

                        <button type="submit" id="salvarPrompt">
                            <i class="fa-regular fa-pen-to-square"></i>
                            Salvar Prompt
                        </button>



                    </form>

                </article>

                <article class="promptsSalvos">
                    <h2 class="prompts_subtitle">
                        <i class="fa-regular fa-bookmark"></i>
                        Seus Prompts
                    </h2>


                    <div class="promptsArmazenados"> <!--promptsArmazenados-->

                    </div><!--promptsArmazenados-->

                </article>

            </section><!--prompts-->

        </div><!--containerPrompts-->




    </main>


    <div class="containerFooter customFooter"> <!--containerFooter-->
        <footer class="container" id="footer">

            <div class="footer__text">

                <p>&copy; PromptGen. Todos os direitos reservados.</p>

            </div>

            <div class="footer__links">


                <a href="https://github.com/sousa44"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.instagram.com/renata_sousw/"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.linkedin.com/in/renata-sousa-/"><i class="fa-brands fa-linkedin"></i></a>
            </div>

        </footer>

    </div><!--containerFooter-->




    <!--scripts-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


    <script src="assets/src/script.js"></script>




</body>

</html>
